# Blueprint do Render — cria tudo o que é preciso com um único clique
# ("New Blueprint" no dashboard do Render, a apontar para este repositório).
#
# Versão simplificada e gratuita: só um serviço web + uma base de
# dados Postgres gratuita. Sem worker Celery nem Redis separados —
# `CELERY_TASK_ALWAYS_EAGER=true` faz as simulações correrem de forma
# síncrona, dentro do próprio pedido HTTP, em vez de serem despachadas
# para uma fila em background. Mais lento por simulação, mas não exige
# nenhum serviço adicional (que já não seria gratuito). O rate
# limiting e a cache de simulações falham "em aberto" automaticamente
# quando não há Redis configurado (ver `app/cache/`), portanto a app
# funciona na mesma, só sem esses dois extras.
#
# Nota sobre a base de dados gratuita do Render: expira 30 dias depois
# de criada (mais 14 dias de tolerância). Para um projeto de
# portfólio/demonstração isto é normalmente aceitável — quando expirar,
# basta criar uma nova base de dados gratuita e atualizar a variável
# DATABASE_URL do serviço web nas definições do Render.

services:
  - type: web
    name: tennis-simulator-api
    runtime: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: tennis-simulator-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: CELERY_TASK_ALWAYS_EAGER
        value: "true"
      - key: ENVIRONMENT
        value: production

databases:
  - name: tennis-simulator-db
    plan: free
